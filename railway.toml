[build]
builder = "nixpacks"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["php82"]

[build.nixpacksPlan.phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[build.nixpacksPlan.phases.build]
cmds = []

[deploy]
startCommand = "php artisan config:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"