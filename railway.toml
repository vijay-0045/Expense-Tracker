[build]
builder = "nixpacks"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip"]

[build.nixpacksPlan.phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[build.nixpacksPlan.phases.build]
cmds = ["php artisan config:cache", "php artisan route:cache"]

[deploy]
startCommand = "php -S 0.0.0.0:80 -t public"